name: Scrape Tum Kaynaklar
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  # 1. Bulutta (Ubuntu Runner) Engeli Olmayan Resmî Kaynakların Taranması
  scrape-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium --with-deps

      - name: Run ISKUR
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scraper/iskur.py

      - name: Run Resmi Gazete
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scraper/resmi_gazete.py

      - name: Run Ilan Gov
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scraper/ilan_gov.py

      - name: Run Adalet PGM
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scraper/adalet_pgm.py

      - name: Run Icisleri Bakanligi
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scraper/icisleri_bakanligi.py

      - name: Run Kurum Portallari (OSYM, Saglik, MEB, Aile, GIB, Diyanet)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scraper/kurum_portallari.py

  # 2. Türkiye IP'si Gerektiren Geoblock'lu 4 Kaynağın Self-Hosted Runner Üzerinden Taranması
  scrape-geoblocked:
    runs-on: [self-hosted, windows]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Geoblocked Turkish Scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scraper/run_local_scrapers.py
